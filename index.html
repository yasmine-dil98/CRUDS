<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>CRUDS</title>
</head>
<body>
    <div class="cruds">
        <div class="head">
            <h2>CRUDS</h2>
            <p>PRODUCT MANAGEMENT SYSTEM</p>
        </div>
        <div class="inputs">
<input type="text" placeholder="title" id="title">
        <div class="price">
            <input onkeyup="getTotal()" type="number" id="price" placeholder="price">
            <input onkeyup="getTotal()"  type="number" id="taxes" placeholder="taxes">
            <input onkeyup="getTotal()" type="number" id="ads" placeholder="ads">
            <input onkeyup="getTotal()"  type="number" id="discount" placeholder="discount">
        <small id="total"></small>
        </div>
        <input type="number" id="count" placeholder="count">
        <input type="text" id="category" placeholder="category">
    <button id="submit">Create</button>
    </div>
        <div class="outputs">
<div class="search-block">
    <input type="text" placeholder="search" id="search">
</div>
<div class="btns">
<button id="btn-title">Search by title</button>
<button id="btn-category">Search by category</button>
</div>
        </div>
        <div id="btn-delete"></div>
    <table>
        <tr>
            <th>id</th>
            <th>title</th>
            <th>price</th>
            <th>taxes</th>
            <th>ads</th>
            <th>discount</th>
            <th>total</th>
            <th>category</th>
            <th>update</th>
            <th>delate</th>
        </tr>
        <tbody id="tbody">
            <tr>
                <td>2</td>
                <td>samsung</td>
                <td>30</td>
                <td>100</td>
                <td>200</td>
                <td>230</td>
                <td>250</td>
                <td>20</td>
                <td><button  id="update">Update</button></td>
                <td><button id="delate">Delate</button></td>
            </tr>
    </table>
    </div>
    <script src="main.js"></script>
</body>
</html>
